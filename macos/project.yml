name: Yasecret
options:
  bundleIdPrefix: com.yasecret
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

targets:
  Yasecret:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Generated
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Yasecret
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableDescription: "Local-first secrets manager"
        NSFaceIDUsageDescription: "Used to unlock your secret vault"
        CFBundleURLTypes:
          - CFBundleURLName: com.yasecret.join
            CFBundleURLSchemes: [yasecret]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_NAME: Yasecret
        PRODUCT_BUNDLE_IDENTIFIER: com.yasecret.app
        # The release workflow overrides both from the tag.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # A stable signature keeps Keychain access across rebuilds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: KBUP5U37QG
        SWIFT_INCLUDE_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/BridgingHeader.h"
      configs:
        # Debug loads the dylib from target/ at runtime: fast links, always the latest Rust code.
        Debug:
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-L$(SRCROOT)/../target/debug"
            - "-lyasecret_ffi"
        # Release links the static library so the app runs on any Mac.
        Release:
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "$(SRCROOT)/../target/universal/release/libyasecret_ffi.a"
            - "-framework"
            - "Security"
            - "-framework"
            - "SystemConfiguration"
            - "-lresolv"
    preBuildScripts:
      - name: "Build Rust FFI"
        script: '"${SRCROOT}/Scripts/build_rust.sh"'
        outputFiles:
          - "$(SRCROOT)/Generated/yasecret_ffi.swift"
          - "$(SRCROOT)/Generated/yasecret_ffiFFI.h"

  YasecretTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Yasecret
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: KBUP5U37QG
