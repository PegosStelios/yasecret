name: Release

# Push a tag like v0.2.0 (matching desktop/src-tauri/tauri.conf.json) to build both apps into a
# draft GitHub release. Publishing the draft is what makes the Windows auto-updater see it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: ilammy/setup-nasm@v1

      # Never ship an update from a commit whose tests fail.
      - name: Rust tests
        run: cargo test -p yasecret-core -p yasecret-ffi

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Builds the installers, signs the update bundles with the updater key and publishes
      # latest.json for the in-app updater.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Yasecret ${{ github.ref_name }}
          releaseBody: See the README for what's new.
          releaseDraft: true
          includeUpdaterJson: true

  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test -p yasecret-core -p yasecret-ffi

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Adds the AppImage, .deb and the Linux entry of latest.json to the draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --config src-tauri/tauri.release.conf.json --bundles appimage,deb
          tagName: ${{ github.ref_name }}
          releaseName: Yasecret ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

  macos:
    needs: windows
    runs-on: macos-15
    # With APPLE_CERTIFICATE (+ password and APPLE_SIGNING_IDENTITY) the app is signed with that
    # certificate: a self-signed one gives every release the same identity, so Keychain access
    # survives updates; a Developer ID one plus APPLE_ID/APPLE_APP_PASSWORD/APPLE_TEAM_ID also
    # notarizes. Without them it's ad-hoc signed. Secrets go only to the steps that need them.
    steps:
      - name: Check for signing secrets
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          echo "sign=$([ -n "$APPLE_CERTIFICATE" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        if: steps.apple.outputs.sign == 'yes'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$kc_pass" "$keychain"
          # Add ours to the search list without dropping the existing keychains.
          existing=()
          while IFS= read -r kc; do existing+=("$kc"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${existing[@]}"

      # Built ad-hoc, then re-signed below: Xcode won't sign with an untrusted (self-signed)
      # identity, while codesign does.
      - name: Build
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project Yasecret.xcodeproj -scheme Yasecret -configuration Release \
            -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build

      - name: Sign
        if: steps.apple.outputs.sign == 'yes'
        working-directory: macos
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZE: ${{ steps.apple.outputs.notarize }}
        run: |
          app=build/Build/Products/Release/Yasecret.app
          flags=(--force --options runtime --keychain "$RUNNER_TEMP/signing.keychain-db" -s "$APPLE_SIGNING_IDENTITY")
          # Apple's timestamp service is needed for notarization (Developer ID only).
          if [ "$NOTARIZE" = yes ]; then flags+=(--timestamp); fi
          codesign "${flags[@]}" "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d -r- "$app"

      - name: Package
        working-directory: macos
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Yasecret.app "$RUNNER_TEMP/Yasecret-macOS.zip"

      - name: Notarize
        if: steps.apple.outputs.notarize == 'yes'
        working-directory: macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/Yasecret-macOS.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/Build/Products/Release/Yasecret.app
          rm "$RUNNER_TEMP/Yasecret-macOS.zip"
          ditto -c -k --keepParent build/Build/Products/Release/Yasecret.app "$RUNNER_TEMP/Yasecret-macOS.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Yasecret-macOS.zip" --clobber

  vscode:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the extension
        working-directory: vscode
        run: |
          npm ci
          npm test
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm run package
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" vscode/*.vsix --clobber
