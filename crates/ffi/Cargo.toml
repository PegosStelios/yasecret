[package]
name    = "yasecret-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name       = "yasecret_ffi"

[dependencies]
yasecret-core = { path = "../core" }
yasecret-sync = { path = "../sync" }
hex           = { workspace = true }
uniffi        = { workspace = true }
zeroize       = { workspace = true }
dirs          = { workspace = true }
thiserror     = "1"
uuid          = { workspace = true }
rusqlite      = { workspace = true }
serde         = { workspace = true, optional = true }

[features]
# Lets the Tauri desktop app return records to its web UI.
serde = ["dep:serde"]

[dev-dependencies]
tempfile = { workspace = true }
