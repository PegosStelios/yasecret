[package]
name    = "yasecret"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "yasecret"
path = "src/main.rs"

[lib]
name = "yasecret_cli"
path = "src/lib.rs"

[dev-dependencies]
iroh          = { workspace = true }
iroh-docs     = { workspace = true }
tempfile      = { workspace = true }
yasecret-core = { path = "../core" }

[dependencies]
serde_json    = { workspace = true }
yasecret-core = { path = "../core" }
yasecret-sync = { path = "../sync" }
clap          = { workspace = true }
rpassword     = { workspace = true }
dirs          = { workspace = true }
zeroize       = { workspace = true }
tokio         = { workspace = true }
hex           = { workspace = true }
sha2          = { workspace = true }
rmcp          = { workspace = true }
schemars      = { workspace = true }
serde         = { workspace = true }
rusqlite      = { workspace = true }
uuid          = { workspace = true }
