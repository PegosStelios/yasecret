[package]
name    = "yasecret"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yasecret"
path = "src/main.rs"

[lib]
name = "yasecret_cli"
path = "src/lib.rs"

[dev-dependencies]
tempfile      = { workspace = true }
yasecret-core = { path = "../core" }

[dependencies]
